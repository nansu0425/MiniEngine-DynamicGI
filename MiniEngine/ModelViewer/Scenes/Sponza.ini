; ModelViewer 가 -scene 없이 여는 scene 이다. key 의 뜻은 ModelViewer.cpp 의 SceneFile 주석에 있다.
; harness 는 이 파일이 아니라 scripts/harness-baseline/scenes/Sponza.ini 로 측정하므로, Scene > Save 로 바꿔도 측정 조건은 그대로다.
; Scale 을 고른 이유는 측정용 scene 의 주석에 있다. scene 이 없는 예전 측정 조건의 줄은 이 파일로 Restore 하므로 Scale 은 측정용 scene
; 과 같게 둔다.
