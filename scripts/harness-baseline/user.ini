; harness 가 실행마다 run 폴더에 복사해 쓰는 결정성 baseline 이다. 여기에 없는 값은 app 의 기본값을 따른다.
; [Window] 가 없으므로 창은 client 1920x1080 으로 만들어진다.
; camera 의 처음 pose 와 light, sky 는 user.ini 가 아니라 scene file 이 정한다 (MiniEngine/ModelViewer/Scenes/Sponza.ini).
[Editor Camera]
Move Speed=1000

[Engine Tuning]
; TAA 의 jitter 와 adaptive exposure 는 frame 마다 결과를 바꾸고, motion blur 는 pose 를 바꾼 다음 frame 을 번지게 한다.
; Exposure 는 기본 pose 에서 UI 를 숨기고 이 Exposure 로 그린 display 와 adaptive exposure 를 수렴시킨 display 의 평균 밝기 (sRGB 를 decode 한 Rec.709 luminance 의 평균) 가 stop (log2) 으로 가장 가까운 2 의 거듭제곱이다.
; frame stats 는 frame 마다 바뀌는 숫자를 display 에 그린다.
Graphics/AA/TAA/Enable=off
Graphics/HDR/Adaptive Exposure=off
Graphics/HDR/Exposure=1
Graphics/Motion Blur/Enable=off
Profiling/Display Frame Stats=off
Ray Tracing/Show Single-Sided Back Faces=0
Ray Tracing/View=Off
Timing/VSync=on

[Panels]
Engine Tuning=1
Profiler=0
Scene Overlay=1
