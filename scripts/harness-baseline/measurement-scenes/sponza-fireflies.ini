; 세 번째 측정 구도다. 사용자가 2026-11-01 에 app 에서 잡았다. 직접광이 반사되는 면이 거의 보이지 않는다. glTF shading 의 흰 점 (밝은 점
; noise artifact) 이 많이 생기고 잘 보이는 곳이라, 흰 점을 줄이는 작업에서 비교의 기준으로 쓴다. path tracer 를 켜고 Shading glTF, Output
; Radiance, Max Bounces 64, Russian roulette on, Seed 0 으로 보며 잡았다. adaptive exposure 를 켜고 잡았다.
; 같은 path tracer 설정으로 4096 sample 쌓아 harness baseline 으로 보면, adaptive exposure 는 Max Exposure 64 에 묶여 수렴하고, 수렴한
; display 는 고정 Exposure 64 의 display 와 평균 밝기가 같다. Max Exposure 에 묶이기 전의 목표는 약 278.6 이다. Exposure 는 display 와
; display 의 view PNG 에만 들어가고, scene capture 와 PT export 는 exposure 전의 값이다.
; harness 는 이 파일에 scene save 를 하지 않는다. key 의 뜻은 ModelViewer.cpp 의 SceneFile 주석에, Scale 을 고른 이유는 scenes/Sponza.ini 에 있다.
