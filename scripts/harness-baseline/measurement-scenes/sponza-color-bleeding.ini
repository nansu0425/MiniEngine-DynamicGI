; 두 번째 측정 구도다. 사용자가 2026-11-01 에 app 에서 잡았다. 직접광이 비추는 영역이 뚜렷하고, 천에 반사된 간접광이 color bleeding 으로
; 보이는 곳이다. adaptive exposure 를 켜고 잡았다.
; path tracer (Shading glTF, Output Radiance, Max Bounces 64, Russian roulette on, Seed 0) 를 4096 sample 쌓아 harness baseline 으로 보면,
; 고정 Exposure 21.541 의 display 가 adaptive exposure 를 수렴시킨 display 와 평균 밝기가 같다. Exposure 는 display 와 display 의 view PNG
; 에만 들어가고, scene capture 와 PT export 는 exposure 전의 값이다.
; harness 는 이 파일에 scene save 를 하지 않는다. key 의 뜻은 ModelViewer.cpp 의 SceneFile 주석에, Scale 을 고른 이유는 scenes/Sponza.ini 에 있다.
