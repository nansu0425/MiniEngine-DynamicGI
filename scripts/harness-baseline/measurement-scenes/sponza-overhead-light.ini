; 첫 번째 측정 구도다. 사용자가 2026-10-31 에 app 에서 잡았다. directional light 가 바로 위에서 비춘다. gizmo 로 맞춘 고도 89.98° 를
; 사용자의 요청으로 정확한 수직으로 바꿨다. adaptive exposure 를 켜고 잡았다.
; path tracer (Shading glTF, Output Radiance, Max Bounces 64, Russian roulette on, Seed 0) 를 4096 sample 쌓아 harness baseline 으로 보면,
; 고정 Exposure 4.4376 의 display 가 adaptive exposure 를 수렴시킨 display 와 평균 밝기가 같다. Exposure 는 display 와 display 의 view PNG
; 에만 들어가고, scene capture 와 PT export 는 exposure 전의 값이다.
; harness 는 이 파일에 scene save 를 하지 않는다. key 의 뜻은 ModelViewer.cpp 의 SceneFile 주석에 있다.
[Model]
glTF=../../../MiniEngine/ModelViewer/glTF-Sample-Assets/Models/Sponza/glTF/Sponza.gltf
; 옛 Sponza (DirectX-Graphics-Samples 의 sponza2.gltf) 로 정한 camera pose 와 측정 조건의 줄을 그대로 쓰도록, 옛 Sponza 를 100 배 하던
; 때와 world 좌표가 같아지는 배율이다. Khronos 판은 node scale 을 빼면 옛 판의 100 배이고, node scale 0.008 x 125 는 약 1 이다.
; scene file 전의 Startup 은 Resize(125 x 반지름) 으로 배율을 정했고, 그 float 도 정확히 125 였다. 그래서 world 좌표가 그때와 bit 단위로 같다.
Scale=125

