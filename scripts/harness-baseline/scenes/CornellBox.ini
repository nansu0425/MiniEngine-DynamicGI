; 작업 13 이 path tracer 를 외부 renderer 와 비교하는 Benedikt Bitterli 의 Cornell Box 의 측정용 scene 이다. 따로 두는 이유는
; 측정용 Sponza (Sponza.ini) 와 같다. harness 는 이 파일에 scene save 를 하지 않는다. key 의 뜻은 ModelViewer.cpp 의 SceneFile 주석에 있다.
[Model]
glTF=../../../MiniEngine/ModelViewer/CornellBox/CornellBox.gltf
; 2 의 거듭제곱이라 glTF 좌표 (Mitsuba 의 world 좌표) 에 곱해도 반올림이 없다. 그래서 측정 조건의 줄의 camera 를 이 배율로 나누면
; Mitsuba 좌표로 정확히 돌아간다. 2^9 이면 상자의 폭이 1024 라서 Sponza 와 크기의 자릿수가 같다. 그래서 user.ini 가 scene 마다
; 함께 쓰는 camera 의 이동 속도로 둘러볼 수 있고, 아래 pose 에서 뒷벽까지의 거리 7.8 x 512 가 far clip 10000 안이다.
Scale=512

[Camera]
; Mitsuba scene 의 sensor 와 같은 위치와 방향이다. 위치는 sensor 의 to_world 의 이동 (0, 1, 6.8) 에 배율을 곱했고, sensor 는 -z 를 본다.
; 시야각은 ModelViewer 의 camera (세로 45°) 를 따르므로 sensor 의 fov 19.5° 와 다르다.
Position=0,512,3481.6
Heading=0
Pitch=0

; light 와 sky 는 app 의 기본값을 숫자로 옮겨 적었다. app 의 기본값이 바뀌어도 이 값으로 찍은 예전 결과와 같은 화면으로 비교하게 한다.
[Directional Light]
Color=1,1,1
Direction=0.335837096,0.923879147,-0.18346864
Intensity=12.566371
Position=0,0,0
Up=-0.810780168,0.38268432,0.442931235

[Sky Light]
Color=1,1,1
Intensity=0.720720708
