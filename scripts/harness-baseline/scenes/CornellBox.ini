; 작업 13 이 path tracer 를 외부 renderer 와 비교하는 Benedikt Bitterli 의 Cornell Box 의 측정용 scene 이다. 따로 두는 이유는
; viewer.py 의 BASELINE_SCENES_DIR 주석에 있다. harness 는 이 파일에 scene save 를 하지 않는다. key 의 뜻은 ModelViewer.cpp 의 SceneFile 주석에 있다.
[Model]
glTF=../../../MiniEngine/ModelViewer/CornellBox/CornellBox.gltf
; 2 의 거듭제곱이라 glTF 좌표 (Mitsuba 의 world 좌표) 에 곱해도 반올림이 없다. 그래서 측정 조건의 줄의 camera 를 이 배율로 나누면
; Mitsuba 좌표로 정확히 돌아간다. 2^9 이면 상자의 폭이 1024 라서 Sponza 와 크기의 자릿수가 같다. 그래서 user.ini 가 scene 마다
; 함께 쓰는 camera 의 이동 속도로 둘러볼 수 있고, 아래 pose 에서 뒷벽까지의 거리 7.8 x 512 가 far clip 10000 안이다.
Scale=512

[Camera]
; Mitsuba scene 의 sensor 와 같은 위치, 방향, 시야각이다. 위치는 sensor 의 to_world 의 이동 (0, 1, 6.8) 에 배율을 곱했고, sensor 는 -z 를
; 본다. sensor 의 fov 19.5° 는 Mitsuba 의 기본 fov_axis 인 x 의 값이고 film 이 1024x1024 정사각형이므로 세로 FOV 도 19.5° 다. 그 값을
; radian 으로 적었다. app 의 scene 이 정사각형이 아니면 sensor 보다 가로로 넓게 보인다.
Position=0,512,3481.6
Heading=0
Pitch=0
Vertical FOV=0.340339204

; 원본 Mitsuba scene 에 없는 빛이므로 intensity 를 0 으로 두어 영향이 없게 한다. 그래야 작업 13 이 외부 renderer 가 원본을 그린 image 와
; 비교할 수 있다. intensity 밖의 값은 app 의 기본값을 숫자로 옮겨 적은 그대로다.
[Directional Light]
Color=1,1,1
Direction=0.335837096,0.923879147,-0.18346864
Intensity=0
Position=0,0,0
Up=-0.810780168,0.38268432,0.442931235
Type=Directional

[Sky]
Color=1,1,1
Intensity=0
