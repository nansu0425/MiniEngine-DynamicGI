; harness 가 scene 을 주지 않고 띄울 때 여는 측정용 Sponza 다. MiniEngine/ModelViewer/Scenes/Sponza.ini 는 사용자가 Scene > Save 로
; 바꾸므로, 측정 조건이 사용자의 scene 을 따라 바뀌지 않게 따로 둔다. harness 는 이 파일에 scene save 를 하지 않는다. key 의 뜻은
; ModelViewer.cpp 의 SceneFile 주석에 있다.
[Model]
glTF=../../../MiniEngine/ModelViewer/glTF-Sample-Assets/Models/Sponza/glTF/Sponza.gltf
; 옛 Sponza (DirectX-Graphics-Samples 의 sponza2.gltf) 로 정한 camera pose 와 측정 조건의 줄을 그대로 쓰도록, 옛 Sponza 를 100 배 하던
; 때와 world 좌표가 같아지는 배율이다. Khronos 판은 node scale 을 빼면 옛 판의 100 배이고, node scale 0.008 x 125 는 약 1 이다.
; scene file 전의 Startup 은 Resize(125 x 반지름) 으로 배율을 정했고, 그 float 도 정확히 125 였다. 그래서 world 좌표가 그때와 bit 단위로 같다.
Scale=125

[Camera]
; scene file 전에 editor.ini (지금의 user.ini) 가 없을 때 Startup 이 계산하던 기본 pose 를 숫자로 옮겨 적은 값이다. 그 계산이 바뀌어도
; 이 pose 로 찍은 예전 결과와 같은 화면으로 비교하게 숫자로 둔다.
Position=1098.72424,651.495239,-38.6904297
Heading=1.60599577
Pitch=-0.534952283

; light 와 sky 는 app 의 기본값을 숫자로 옮겨 적었다. app 의 기본값이 바뀌어도 이 값으로 찍은 예전 결과와 같은 화면으로 비교하게 한다.
[Directional Light]
Color=1,1,1
Direction=0.335837096,0.923879147,-0.18346864
Intensity=12.566371
Position=0,0,0
Up=-0.810780168,0.38268432,0.442931235

[Sky Light]
Color=1,1,1
Intensity=0.720720708
